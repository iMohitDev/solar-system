      dev-deploy:
        name: Create Kubernetes Cluster & Dev-deploy
        runs-on: ubuntu-latest

        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:latest
#          INGRESS_IP: ${{ env.INGRESS_IP }}

        environment:
          name: development
          url: https://${{ steps.set-ingress-host.outputs.APP_INGRESS_HOST }}


        outputs:
          APP_INGRESS_URL: ${{ steps.set-ingress-host.outputs.APP_INGRESS_HOST }}

        steps:
          
          - name: Docker Hub Login
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}
          
          - name: Install kubectl CLI
            uses: azure/setup-kubectl@v4
            with:
              version: latest

          - name: Install Kind
            run: |
              curl -fLo kind \
                https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
              chmod +x kind
              sudo mv kind /usr/local/bin/kind

          - name: Create Kubernetes Cluster
            run: |
              kind create cluster --name github-lab --wait 120s
          
          - name: Create application namespace
            env:
              NAMESPACE: ${{ vars.NAMESPACE }}
            run: |
              kubectl create namespace "$NAMESPACE" \
                --dry-run=client -o yaml | kubectl apply -f -

          - name: Verify Kubeconfig
            run: |
              kubectl config current-context
              kubectl config get-contexts
              test -s "$HOME/.kube/config"

          - name: Get Kubernetes Nodes
            run: |
              kubectl get nodes -o wide

          - name: Deploy Nginx
            run: |
              kubectl get pods
              echo
              cat /etc/os-release
              echo
              free -h
          
          - name: Checkout repository
            uses: actions/checkout@v7

          # - name: Save NGINX Ingress Controller IP
          #   id: save_ingress_ip
          #   run: |
          #     echo "INGRESS_IP=$(kubectl -n ingress-nginx \
          #       get svc ingress-nginx-controller \
          #       -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV


          - name: Set ingress address for runner-local access
            run: |
              echo "INGRESS_IP=127.0.0.1" >> "$GITHUB_ENV"
          

          - name: Replace tokens in Kubernetes manifests
            uses: cschleiden/replace-tokens@v1
            with:
              tokenPrefix: '{_'
              tokenSuffix: '_}'
              files: 'kubernetes/development/*.yaml'


          - name: Verify token replacement
            run: |
              echo "=== deployment.yaml ==="
              cat kubernetes/development/deployment.yaml
              echo "=== service.yaml ==="
              cat kubernetes/development/service.yaml
              echo "=== ingress.yaml ==="
              cat kubernetes/development/ingress.yaml

          - name: Create MongoDB secret
            run: |
              kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
                --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
                --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
                --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
                --save-config \
                --dry-run=client \
                -o yaml | kubectl apply -f -
          
          - name: Display Pre deployment and secret
            run: |    
              kubectl -n development get all
              kubectl -n development get secrets

          - name: Deploy manifests
            run: kubectl apply -f kubernetes/development

          - name: Display Post deployment and secret
            run: |  
              sleep 10s  
              kubectl -n development get all
              kubectl -n development get secrets
              kubectl -n development get ing

              NODE_IP=$(kubectl get node github-lab-control-plane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')

              NODE_PORT=$(kubectl -n development get service solar-system -o jsonpath='{.spec.ports[0].nodePort}')

              echo "Testing application at http://${NODE_IP}:${NODE_PORT}"
              curl --fail --show-error --verbose \
              --retry 10 --retry-connrefused --retry-delay 2 \
              --connect-timeout 5 --max-time 15 \
              "http://${NODE_IP}:${NODE_PORT}/"

#             curl -v https://solar-system-development.127.0.0.1.nip.io:32335


              
          - name: Diagnose image pull failure
            if: always()
            env:
              NAMESPACE: ${{ vars.NAMESPACE }}
            run: |
              kubectl -n "$NAMESPACE" describe pods -l app=solar-system
          
          - name: Set App Ingress Host URL
            id: set-ingress-host
            run: |
              echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} \
                get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" \
                >> "$GITHUB_OUTPUT"
          


  
