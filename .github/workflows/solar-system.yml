name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME  }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}      

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest

        steps:

        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Setup NodeJS Version
          uses: actions/setup-node@v3
          with:
            node-version: 20

        # Caching Usage Step

        - name: Cache NPM dependencies
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v7
          with:
            name: Mocha-Test-Result
            path: test-results.xml
            retention-days: 5


    code-coverage:
      name: Code Coverage
      runs-on: ubuntu-latest
      steps:

        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Setup NodeJS Version
          uses: actions/setup-node@v3
          with:
            node-version: 20

        # Caching Usage Step

        - name: Cache NPM dependencies
          uses: actions/cache@v5
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Generate Coverage Report
          run: npm run coverage
          id: generate-report
          continue-on-error: true

          # By enabling continue-on-error on the coverage step, your workflow still uploads the coverage report even if the threshold isn’t met.

        - name: Archive Coverage Report
          
          # if: failure() && steps.generate-report == 'failure' 
          # This runs the archive step when the testing step fails:

          # if: always()
          # If you want the test results available on both success and failure, use always():
          
          uses: actions/upload-artifact@v7
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5


    docker:
      name: Containerization
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      steps:

        - name: Checkout Repository
          uses: actions/checkout@v7

        
        # 1. Login to the Docker Hub and GHCR  

        - name: Docker Hub Login
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        
        - name: GHCR Login
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}        


        # 2. Build the Docker image without pushing

        - name: Build Docker Image for Testing
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

       
        # 3. Run tests against the local image

        - name: Docker Image Testing
          run: |
            # List built images
            docker images

            # Run the container in detached mode
            docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

            # Display container IP address
            echo "Container IP:" $(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)

            # Test the /live endpoint
            echo "Testing /live endpoint"
            wget -q -O - http://127.0.0.1:3000/live | grep live

       
          # 4. Push the tested image to Docker Hub
        
        - name: Docker Push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true                    # enable push to registry
            tags: |
              ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
      #        ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}


