name: Solar System Original Workflow

on:
  workflow_dispatch:
  push:
#     branches:
#       - main
#       - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME  }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  dev-deploy:

    runs-on: self-hosted

    # Variables for all steps:
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host.outputs.APP_INGRESS_HOST }}

    # Enforce your GitHub environment rules:
    environment:
      name: development
      url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}   
      
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install kubectl CLI
        uses: azure/setup-kubectl@v5
        with:
          version: '1.26.0'

      - name: Set Kubeconfig Context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Fetch Kubernetes Cluster Details
        run: |
          kubectl version
          echo "----------------------------------------------------------------"
          kubectl get nodes
      
      - name: Save NGINX Ingress Controller IP
        id: save_ingress_ip
        run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller | awk '{print $3}' | tail -n 1)" >> $GITHUB_ENV

#          echo "INGRESS_IP=$(kubectl -n ingress-nginx \
#          get svc ingress-nginx-controller \
#          -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV

      - name: Replace tokens in Kubernetes manifests
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '{_'
          tokenSuffix: '_}'
          files: 'kubernetes/development/*.yaml'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:latest
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Verify token replacement
        run: |
          echo "=== deployment.yaml ==="
          cat kubernetes/development/deployment.yaml
          echo "=== service.yaml ==="
          cat kubernetes/development/service.yaml
          echo "=== ingress.yaml ==="
          cat kubernetes/development/ingress.yaml


      - name: Create MongoDB secret
        run: |
          kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
            --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
            --save-config \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: kubectl apply -f kubernetes/development


      - name: Set App Ingress Host URL
        id: set-ingress-host
        run: |
          echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} \
            get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" \
            >> "$GITHUB_OUTPUT"





  integration-testing:
    name: Dev Integration Testing
    needs: [dev-deploy]
    runs-on: self-hosted
    steps:
      - name: Test URL Output with curl and jq
        env:
          URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
        run: |
          echo "URL: $URL"
          echo "-----------------------------------------"
          curl http://$URL/live -s -k | jq -r .status | grep -i live      
        

      